# =====================================================================
# Dyson Lightcycle Morph - Weekly wake-up alarm (phone friendly)
# =====================================================================
# Drop this file into HA's `packages/dyson_week_alarm.yaml` (packages
# mode enabled in configuration.yaml) and reload. HA creates the 14
# helpers + 1 automation on the next configuration reload.
#
# Control on your phone/dashboard:
#   - switch.day_MON ... switch.day_SUN   on/off per weekday
#   - date_time.wake_MON ... wake_SUN    wake time per day
#
# On each wake time, the chosen days are matched, the lamp is ramped up
# (soft sunrise). Enable the `.._enabled` toggles to arm a day.
# =====================================================================

input_boolean:
  wake_mon:
    name: Wake Monday
    icon: mdi:moon-waning-crescent
  wake_tue:
    name: Wake Tuesday
    icon: mdi:moon-waning-crescent
  wake_wed:
    name: Wake Wednesday
    icon: mdi:moon-waning-crescent
  wake_thu:
    name: Wake Thursday
    icon: mdi:moon-waning-crescent
  wake_fri:
    name: Wake Friday
    icon: mdi:moon-waning-crescent
  wake_sat:
    name: Wake Saturday
    icon: mdi:moon-waxing-crescent
  wake_sun:
    name: Wake Sunday
    icon: mdi:moon-waxing-crescent

input_datetime:
  wake_time_mon:
    name: Wake time Monday
    has_date: false
    has_time: true
    icon: mdi:alarm
  wake_time_tue:
    name: Wake time Tuesday
    has_date: false
    has_time: true
    icon: mdi:alarm
  wake_time_wed:
    name: Wake time Wednesday
    has_date: false
    has_time: true
    icon: mdi:alarm
  wake_time_thu:
    name: Wake time Thursday
    has_date: false
    has_time: true
    icon: mdi:alarm
  wake_time_fri:
    name: Wake time Friday
    has_date: false
    has_time: true
    icon: mdi:alarm
  wake_time_sat:
    name: Wake time Saturday
    has_date: false
    has_time: true
    icon: mdi:alarm
  wake_time_sun:
    name: Wake time Sunday
    has_date: false
    has_time: true
    icon: mdi:alarm

input_number:
  wake_duration:
    name: Wake ramp duration
    min: 5
    max: 60
    step: 5
    unit_of_measurement: min
    mode: slider
    icon: mdi:timer-sand
    initial: 30
  wake_brightness:
    name: Wake target brightness
    min: 100
    max: 1000
    step: 50
    unit_of_measurement: lm
    mode: slider
    icon: mdi:brightness-6
    initial: 800

automation:
  - alias: "Dyson Lamp: Weekly wake-up alarm"
    id: dyson_week_alarm_check
    description: >-
      Every minute: if today's alarm is armed and we are inside the ramp
      window (wake time minus ramp duration .. wake time), start the sunrise
      ramp so it reaches full brightness at the wake time. If the window was
      already started (e.g. you set the wake time only a few minutes ahead),
      the ramp starts immediately with the remaining time.
    trigger:
      - platform: time_pattern
        minutes: "/1"
    variables:
      day: "{{ ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()] }}"
      max_duration: "{{ states('input_number.wake_duration') | int(30) }}"
      lumens: "{{ states('input_number.wake_brightness') | int(800) }}"
      wake_state: "{{ states('input_datetime.wake_time_' ~ day) }}"
      remaining_min: >-
        {% if wake_state in ['unknown', 'unavailable', 'none', ''] %}-1
        {% else %}{{ (((today_at(wake_state) - now()).total_seconds() + 59) // 60) | int }}
        {% endif %}
    condition:
      - condition: template
        value_template: "{{ is_state('input_boolean.wake_' ~ day, 'on') }}"
      # Inside the ramp window: between 1 minute and the full ramp duration before wake time.
      - condition: template
        value_template: "{{ 1 <= remaining_min | int(-1) <= max_duration | int(30) }}"
      # Not already started for this alarm.
      - condition: template
        value_template: >-
          {{ (now().timestamp() - as_timestamp(this.attributes.last_triggered, 0))
             > (max_duration | int(30)) * 60 }}
    action:
      - service: dyson_lamp.set_wakeup
        data:
          duration: "{{ remaining_min | int(1) }}"
          lumens: "{{ lumens }}"
          kelvin: 4800
    mode: single
