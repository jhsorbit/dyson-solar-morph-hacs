# =====================================================================
# Dyson Lightcycle Morph - Weekly wake-up alarm (phone friendly)
# =====================================================================
# Drop this file into HA's `packages/dyson_week_alarm.yaml` (packages
# mode enabled in configuration.yaml) and reload. HA creates the 14
# helpers + 1 automation on the next configuration reload.
#
# Control on your phone/dashboard:
#   - switch.day_MON ... switch.day_SUN   on/off per weekday
#   - date_time.wake_MON ... wake_SUN    wake time per day
#
# On each wake time, the chosen days are matched, the lamp is ramped up
# (soft sunrise). Enable the `.._enabled` toggles to arm a day.
# =====================================================================

input_boolean:
  wake_mon:
    name: Wake Monday
    icon: mdi:moon-waning-crescent
  wake_tue:
    name: Wake Tuesday
    icon: mdi:moon-waning-crescent
  wake_wed:
    name: Wake Wednesday
    icon: mdi:moon-waning-crescent
  wake_thu:
    name: Wake Thursday
    icon: mdi:moon-waning-crescent
  wake_fri:
    name: Wake Friday
    icon: mdi:moon-waning-crescent
  wake_sat:
    name: Wake Saturday
    icon: mdi:moon-waxing-crescent
  wake_sun:
    name: Wake Sunday
    icon: mdi:moon-waxing-crescent

input_datetime:
  wake_time_mon:
    name: Wake time Monday
    has_date: false
    has_time: true
    icon: mdi:alarm
  wake_time_tue:
    name: Wake time Tuesday
    has_date: false
    has_time: true
    icon: mdi:alarm
  wake_time_wed:
    name: Wake time Wednesday
    has_date: false
    has_time: true
    icon: mdi:alarm
  wake_time_thu:
    name: Wake time Thursday
    has_date: false
    has_time: true
    icon: mdi:alarm
  wake_time_fri:
    name: Wake time Friday
    has_date: false
    has_time: true
    icon: mdi:alarm
  wake_time_sat:
    name: Wake time Saturday
    has_date: false
    has_time: true
    icon: mdi:alarm
  wake_time_sun:
    name: Wake time Sunday
    has_date: false
    has_time: true
    icon: mdi:alarm

input_number:
  wake_duration:
    name: Wake ramp duration
    min: 5
    max: 60
    step: 5
    unit_of_measurement: min
    mode: slider
    icon: mdi:timer-sand
    initial: 30
  wake_brightness:
    name: Wake target brightness
    min: 100
    max: 1000
    step: 50
    unit_of_measurement: lm
    mode: slider
    icon: mdi:brightness-6
    initial: 800

automation:
  - alias: "Dyson Lamp: Weekly wake-up alarm"
    id: dyson_week_alarm_check
    description: >-
      Every minute: if today's alarm is armed and the ramp start time
      (wake time minus ramp duration) is now, start the sunrise ramp so
      it reaches full brightness exactly at the wake time.
    trigger:
      - platform: time_pattern
        minutes: "/1"
    variables:
      day: "{{ ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()] }}"
      duration: "{{ states('input_number.wake_duration') | int(30) }}"
      lumens: "{{ states('input_number.wake_brightness') | int(800) }}"
      wake_time: "{{ states('input_datetime.wake_time_' ~ day) }}"
    condition:
      - condition: template
        value_template: "{{ is_state('input_boolean.wake_' ~ day, 'on') }}"
      - condition: template
        value_template: >-
          {% if wake_time in ['unknown', 'unavailable'] %}false{% else %}
          {{ (today_at(wake_time) - timedelta(minutes=duration)).strftime('%H:%M')
             == now().strftime('%H:%M') }}
          {% endif %}
    action:
      - service: dyson_lamp.set_wakeup
        data:
          duration: "{{ duration }}"
          lumens: "{{ lumens }}"
          kelvin: 4800
    mode: single
