# =====================================================================
# Dyson Lightcycle Morph - Weekly alarm dashboard card
# =====================================================================
# Dashboard -> Edit -> Add card -> Manual -> paste this block.
# Tap a day tile to arm/disarm it; tap a time tile to set the wake time.
# Uses only built-in tile/grid cards (no custom cards needed).
# =====================================================================
type: vertical-stack
cards:
  - type: heading
    heading: Wake-up light
    heading_style: title
    icon: mdi:weather-sunset-up
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: input_boolean.wake_mon
        name: Monday
        icon: mdi:power-sleep
        color: amber
        tap_action:
          action: toggle
      - type: tile
        entity: input_datetime.wake_time_mon
        name: Wake time
        icon: mdi:alarm
        color: orange
        tap_action:
          action: more-info
      - type: tile
        entity: input_boolean.wake_tue
        name: Tuesday
        icon: mdi:power-sleep
        color: amber
        tap_action:
          action: toggle
      - type: tile
        entity: input_datetime.wake_time_tue
        name: Wake time
        icon: mdi:alarm
        color: orange
        tap_action:
          action: more-info
      - type: tile
        entity: input_boolean.wake_wed
        name: Wednesday
        icon: mdi:power-sleep
        color: amber
        tap_action:
          action: toggle
      - type: tile
        entity: input_datetime.wake_time_wed
        name: Wake time
        icon: mdi:alarm
        color: orange
        tap_action:
          action: more-info
      - type: tile
        entity: input_boolean.wake_thu
        name: Thursday
        icon: mdi:power-sleep
        color: amber
        tap_action:
          action: toggle
      - type: tile
        entity: input_datetime.wake_time_thu
        name: Wake time
        icon: mdi:alarm
        color: orange
        tap_action:
          action: more-info
      - type: tile
        entity: input_boolean.wake_fri
        name: Friday
        icon: mdi:power-sleep
        color: amber
        tap_action:
          action: toggle
      - type: tile
        entity: input_datetime.wake_time_fri
        name: Wake time
        icon: mdi:alarm
        color: orange
        tap_action:
          action: more-info
      - type: tile
        entity: input_boolean.wake_sat
        name: Saturday
        icon: mdi:power-sleep
        color: amber
        tap_action:
          action: toggle
      - type: tile
        entity: input_datetime.wake_time_sat
        name: Wake time
        icon: mdi:alarm
        color: orange
        tap_action:
          action: more-info
      - type: tile
        entity: input_boolean.wake_sun
        name: Sunday
        icon: mdi:power-sleep
        color: amber
        tap_action:
          action: toggle
      - type: tile
        entity: input_datetime.wake_time_sun
        name: Wake time
        icon: mdi:alarm
        color: orange
        tap_action:
          action: more-info
  - type: entities
    title: Sunrise settings
    show_header_toggle: false
    entities:
      - entity: input_number.wake_duration
        name: Ramp duration
      - entity: input_number.wake_brightness
        name: Target brightness
  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        name: Test sunrise
        icon: mdi:weather-sunset-up
        show_state: false
        tap_action:
          action: perform-action
          perform_action: dyson_lamp.set_wakeup
          data:
            duration: 2
            lumens: 800
            kelvin: 4800
      - type: button
        name: Stop sunrise
        icon: mdi:stop-circle-outline
        show_state: false
        tap_action:
          action: perform-action
          perform_action: dyson_lamp.cancel_wakeup
